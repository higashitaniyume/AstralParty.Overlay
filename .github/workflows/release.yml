name: Release AstralParty.Overlay
on:
  push:
    tags:
      - "overlay-*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish CesiumLoader.Overlay.csproj -c Release -r win-x64 --self-contained false
      - run: |
          mkdir dist
          cp bin/Release/net8.0-windows/win-x64/CesiumOverlay.* dist/
          cp overlay_config.default.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: overlay-win-x64
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
